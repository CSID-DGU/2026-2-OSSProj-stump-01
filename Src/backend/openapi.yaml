# 서울 TreeCare API 명세 (OpenAPI 3.1)
# 서버를 켜고 http://localhost:4000/docs 에서 본다.
# API를 추가·변경하면 이 파일도 같이 고친다(CLAUDE.md 작업 방식).
openapi: 3.1.0
info:
  title: 서울 TreeCare API
  version: 0.1.0
  description: |
    시민 모바일 웹과 구청 웹이 함께 쓰는 API 서버.
    - 구청 전용 경로는 `/admin` 아래에 있고, 구청 담당자 토큰이 필요하다. 담당자 소속 관리청의 데이터만 다룬다.
    - 에러 응답은 `{ "error": { "code": "...", "message": "..." } }` 형식이다.
servers:
  - url: http://localhost:4000

tags:
  - name: 공통
  - name: 구청
  - name: 시민

paths:
  /health:
    get:
      tags: [공통]
      summary: 서버·DB 상태 확인
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /admin/applications:
    get:
      tags: [구청]
      summary: 돌보미 신청 목록 (내 관리청)
      description: 담당자 관리청에 있는 나무의 신청서 목록. 대기(pending)는 오래 기다린 순, 나머지 상태는 최근 순이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, ended], default: pending } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 신청 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Application' } }
                  total: { type: integer, description: 조건에 맞는 전체 개수 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [구청]
      summary: 돌보미 신청 상세
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 신청서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [구청]
      summary: 돌보미 신청 심사 (승인·반려)
      description: |
        대기(pending) 중인 신청서만 승인하거나 반려한다. 반려는 사유가 필요하다.
        상태 변경과 함께 신청자에게 결과 알림(`application_result`)을 만든다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: approved }
                - type: object
                  required: [status, rejectReason]
                  properties:
                    status: { type: string, const: rejected }
                    rejectReason: { type: string, minLength: 1, maxLength: 500 }
            examples:
              승인: { value: { status: approved } }
              반려: { value: { status: rejected, rejectReason: 이미 돌보미가 충분해요 } }
      responses:
        '200':
          description: 심사 결과가 반영된 신청서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/monthly-reports:
    get:
      tags: [구청]
      summary: 월간 보고서 목록 (내 관리청)
      description: 담당자 관리청에 제출된 보고서 목록. 검토 대기(submitted)는 오래 기다린 순, 나머지 상태는 최근 순이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, approved, revision_requested], default: submitted } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 보고서 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MonthlyReport' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/monthly-reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [구청]
      summary: 월간 보고서 상세 (묶인 활동 기록 포함)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 보고서와 활동 기록(날짜순)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [구청]
      summary: 월간 보고서 검토 (승인·보완 요청)
      description: |
        검토 대기(submitted) 보고서만 승인하거나 보완 요청한다. 보완 요청은 의견(reviewNote)이 필요하다.
        승인하면 보고서의 활동 시간 합계(totalMinutes)를 봉사시간으로 기록한다.
        상태 변경, 봉사시간 기록, 결과 알림(`monthly_report_result`)은 한 트랜잭션이다.
        같은 보고서는 한 번만 인정된다(volunteer_hours.monthly_report_id 유일 제약).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: approved }
                    reviewNote: { type: string, maxLength: 1000 }
                - type: object
                  required: [status, reviewNote]
                  properties:
                    status: { type: string, const: revision_requested }
                    reviewNote: { type: string, minLength: 1, maxLength: 1000 }
            examples:
              승인: { value: { status: approved } }
              보완 요청: { value: { status: revision_requested, reviewNote: 사진을 한 장 더 붙여 주세요 } }
      responses:
        '200':
          description: 검토 결과가 반영된 보고서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/dashboard:
    get:
      tags: [구청]
      summary: 한눈에 보기 (구청 웹 첫 화면)
      description: |
        담당자 관리청 기준으로 처리할 일과 이달 현황을 센다. "이달"은 한국 시간 달력 기준이다.
        - 미제출 돌보미: 그 달에 활동 기간이 걸친 승인된 돌보미 중 그 달에 이 관리청으로 보고서를 하나도 내지 않은 사람
        - 이달 봉사시간: 그 달에 승인되어 기록된 봉사시간
        - organizationId를 주면 그 단체 회원으로 좁힌다. `organizations`는 필터에 보여 줄 단체 목록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, description: "YYYY-MM, 없으면 이번 달", schema: { type: string, example: 2026-11 } }
        - { name: organizationId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/rental-items:
    get:
      tags: [구청]
      summary: 물품·재고 목록 (내 관리청)
      description: stock은 아직 배정하지 않은 재고다. 승인할 때 신청 수량만큼 줄어든다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 물품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RentalItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [구청]
      summary: 물품 등록
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50, example: 쿨토시 }
                stock: { type: integer, minimum: 0, default: 0 }
      responses:
        '201':
          description: 등록된 물품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/rental-items/{id}:
    patch:
      tags: [구청]
      summary: 물품 이름·재고 수정
      description: stock은 지금 남은(배정 가능한) 재고를 새 값으로 바꾼다. 입고하면 늘리고, 실사 후 맞춘다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 50 }
                stock: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 수정된 물품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rentals:
    get:
      tags: [구청]
      summary: 물품 신청 목록 (내 관리청)
      description: 승인 대기(requested)는 오래 기다린 순, 나머지 상태는 최근 순이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, approved, rejected, received], default: requested } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 신청 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Rental' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/rentals/{id}:
    patch:
      tags: [구청]
      summary: 물품 신청 처리 (승인·반려·수령)
      description: |
        requested → approved(재고 차감) 또는 rejected, approved → received 순서로만 바뀐다. 반납은 없다.
        재고가 신청 수량보다 적으면 승인할 수 없다(409).
        승인·반려하면 신청자에게 결과 알림(`rental_result`)을 만든다. 상태 변경·재고 차감·알림은 한 트랜잭션이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: approved }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: rejected }
                    rejectReason: { type: string, maxLength: 500, description: 선택. 알림에 함께 보낸다 }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: received }
            examples:
              승인: { value: { status: approved } }
              반려: { value: { status: rejected, rejectReason: 이번 달 물량이 끝났어요 } }
              수령: { value: { status: received } }
      responses:
        '200':
          description: 처리된 신청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /volunteer-hours/me:
    get:
      tags: [시민]
      summary: 내 봉사시간
      description: 구청이 승인해 기록된 내 봉사시간만 최신순으로 준다. 본인 것만 볼 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: year, in: query, description: 기록된 해(한국 시간). 없으면 전체, schema: { type: integer } }
      responses:
        '200':
          description: 봉사시간 목록과 합계
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMinutes: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        minutes: { type: integer }
                        recordedAt: { type: string, format: date-time }
                        monthlyReport:
                          type: object
                          properties:
                            id: { type: integer }
                            agency: { type: string }
                            submittedAt: { type: string, format: date-time }
                            firstDate: { type: string, format: date }
                            lastDate: { type: string, format: date }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
    Application:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, ended], description: 대기 / 승인 / 반려 / 종료 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        motivation: { type: [string, 'null'], description: 참여 동기 }
        rejectReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [integer, 'null'], description: 심사한 담당자 id }
        applicant:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            realName: { type: [string, 'null'] }
        tree:
          type: object
          properties:
            id: { type: integer }
            species: { type: string, example: 은행나무 }
            district: { type: string, description: 위치한 자치구 }
            dong: { type: [string, 'null'] }
            roadName: { type: [string, 'null'], description: 노선 }
            address: { type: [string, 'null'] }
            caregiverCount: { type: integer, description: 지금 승인된 돌보미 수 }
    MonthlyReport:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [submitted, approved, revision_requested], description: 검토 대기 / 승인 / 보완 요청 }
        agency: { type: string, description: 제출한 관리청 }
        totalMinutes: { type: integer, description: 묶인 기록의 활동 시간 합계(분) }
        reviewNote: { type: [string, 'null'], description: 구청 의견 }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [integer, 'null'] }
        caregiver:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            realName: { type: [string, 'null'] }
        recordCount: { type: integer }
        treeCount: { type: integer }
        firstDate: { type: [string, 'null'], format: date }
        lastDate: { type: [string, 'null'], format: date }
        volunteerMinutes: { type: [integer, 'null'], description: 승인되어 기록된 봉사시간(분) }
    MonthlyReportDetail:
      allOf:
        - { $ref: '#/components/schemas/MonthlyReport' }
        - type: object
          properties:
            records:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  activityDate: { type: string, format: date }
                  activityKind: { type: [string, 'null'] }
                  durationMin: { type: integer }
                  memo: { type: [string, 'null'] }
                  photoUrl: { type: [string, 'null'] }
                  verification: { type: string, enum: [none, location, photo] }
                  tree:
                    type: object
                    properties:
                      id: { type: integer }
                      species: { type: string }
                      roadName: { type: [string, 'null'] }
                      address: { type: [string, 'null'] }
    Dashboard:
      type: object
      properties:
        agency: { type: string }
        month: { type: string, example: 2026-11 }
        organizationId: { type: [integer, 'null'] }
        monthlyReports:
          type: object
          properties:
            pending: { type: integer, description: 검토 대기 보고서 }
            revisionRequested: { type: integer, description: 보완 요청 후 재제출 대기 }
        applications:
          type: object
          properties:
            pending: { type: integer, description: 심사 대기 신청 }
        rentals:
          type: object
          properties:
            requested: { type: integer, description: 승인 대기 물품 }
            awaitingPickup: { type: integer, description: 승인 후 수령 대기 }
        incidentReports:
          type: object
          description: 이상 신고(reports)
          properties:
            pending: { type: integer, description: 확인 필요 }
            inspecting: { type: integer, description: 현장 확인 }
            oldestUnresolvedAt: { type: [string, 'null'], format: date-time, description: 가장 오래된 미처리 신고 접수 시각 }
        caregivers:
          type: object
          properties:
            active: { type: integer, description: 이달 활동 중인 돌보미 }
            missingReport: { type: integer, description: 이달 보고서 미제출 돌보미 }
            missingReportList:
              type: array
              description: 미제출 돌보미 (최대 50명)
              items:
                type: object
                properties:
                  userId: { type: integer }
                  nickname: { type: string }
                  realName: { type: [string, 'null'] }
                  treeCount: { type: integer }
        volunteerHours:
          type: object
          properties:
            minutes: { type: integer, description: 이달 기록된 봉사시간(분) }
            people: { type: integer, description: 이달 봉사시간을 인정받은 사람 수 }
        organizations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    RentalItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        stock: { type: integer, description: 아직 배정하지 않은 재고 }
        requestedQuantity: { type: integer, description: 승인 대기 중인 신청 수량 합계 }
        awaitingPickupQuantity: { type: integer, description: 승인했지만 아직 수령하지 않은 수량 합계 }
        createdAt: { type: string, format: date-time }
    Rental:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, approved, rejected, received], description: 신청 / 승인 / 반려 / 수령 }
        quantity: { type: integer }
        rejectReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        handledAt: { type: [string, 'null'], format: date-time }
        handledBy: { type: [integer, 'null'] }
        receivedAt: { type: [string, 'null'], format: date-time }
        item:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            stock: { type: integer }
        requester:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            realName: { type: [string, 'null'] }
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: "지금 상태에서는 할 수 없음 (예: 이미 심사한 신청서)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 로그인 필요 (토큰 없음·만료)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음 (구청 담당자가 아님)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상 없음 (다른 관리청의 데이터도 404로 돌려준다)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
