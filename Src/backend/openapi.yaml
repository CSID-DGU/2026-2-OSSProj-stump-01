# 서울 TreeCare API 명세 (OpenAPI 3.1)
# 서버를 켜고 http://localhost:4000/docs 에서 본다.
# API를 추가·변경하면 이 파일도 같이 고친다(CLAUDE.md 작업 방식).
openapi: 3.1.0
info:
  title: 서울 TreeCare API
  version: 0.1.0
  description: |
    시민 모바일 웹과 구청 웹이 함께 쓰는 API 서버.
    - 구청 전용 경로는 `/admin` 아래에 있고, 구청 담당자 토큰이 필요하다. 담당자 소속 관리청의 데이터만 다룬다.
    - 에러 응답은 `{ "error": { "code": "...", "message": "..." } }` 형식이다.
servers:
  - url: http://localhost:4000

tags:
  - name: 공통
  - name: 구청
  - name: 시민

paths:
  /health:
    get:
      tags: [공통]
      summary: 서버·DB 상태 확인
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  /admin/applications:
    get:
      tags: [구청]
      summary: 돌보미 신청 목록 (내 관리청)
      description: 담당자 관리청에 있는 나무의 신청서 목록. 대기(pending)는 오래 기다린 순, 나머지 상태는 최근 순이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected, ended], default: pending } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 신청 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Application' } }
                  total: { type: integer, description: 조건에 맞는 전체 개수 }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/applications/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [구청]
      summary: 돌보미 신청 상세
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 신청서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [구청]
      summary: 돌보미 신청 심사 (승인·반려)
      description: |
        대기(pending) 중인 신청서만 승인하거나 반려한다. 반려는 사유가 필요하다.
        상태 변경과 함께 신청자에게 결과 알림(`application_result`)을 만든다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: approved }
                - type: object
                  required: [status, rejectReason]
                  properties:
                    status: { type: string, const: rejected }
                    rejectReason: { type: string, minLength: 1, maxLength: 500 }
            examples:
              승인: { value: { status: approved } }
              반려: { value: { status: rejected, rejectReason: 이미 돌보미가 충분해요 } }
      responses:
        '200':
          description: 심사 결과가 반영된 신청서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Application' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/monthly-reports:
    get:
      tags: [구청]
      summary: 월간 보고서 목록 (내 관리청)
      description: 담당자 관리청에 제출된 보고서 목록. 검토 대기(submitted)는 오래 기다린 순, 나머지 상태는 최근 순이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [submitted, approved, revision_requested], default: submitted } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 보고서 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/MonthlyReport' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/monthly-reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [구청]
      summary: 월간 보고서 상세 (묶인 활동 기록 포함)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 보고서와 활동 기록(날짜순)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReportDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [구청]
      summary: 월간 보고서 검토 (승인·보완 요청)
      description: |
        검토 대기(submitted) 보고서만 승인하거나 보완 요청한다. 보완 요청은 의견(reviewNote)이 필요하다.
        승인하면 보고서의 활동 시간 합계(totalMinutes)를 봉사시간으로 기록한다.
        상태 변경, 봉사시간 기록, 결과 알림(`monthly_report_result`)은 한 트랜잭션이다.
        같은 보고서는 한 번만 인정된다(volunteer_hours.monthly_report_id 유일 제약).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: approved }
                    reviewNote: { type: string, maxLength: 1000 }
                - type: object
                  required: [status, reviewNote]
                  properties:
                    status: { type: string, const: revision_requested }
                    reviewNote: { type: string, minLength: 1, maxLength: 1000 }
            examples:
              승인: { value: { status: approved } }
              보완 요청: { value: { status: revision_requested, reviewNote: 사진을 한 장 더 붙여 주세요 } }
      responses:
        '200':
          description: 검토 결과가 반영된 보고서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReportDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/dashboard:
    get:
      tags: [구청]
      summary: 한눈에 보기 (구청 웹 첫 화면)
      description: |
        담당자 관리청 기준으로 처리할 일과 이달 현황을 센다. "이달"은 한국 시간 달력 기준이다.
        - 미제출 돌보미: 그 달에 활동 기간이 걸친 승인된 돌보미 중 그 달에 이 관리청으로 보고서를 하나도 내지 않은 사람
        - 이달 봉사시간: 그 달에 승인되어 기록된 봉사시간
        - organizationId를 주면 그 단체 회원으로 좁힌다. `organizations`는 필터에 보여 줄 단체 목록이다.
        - 관리 사각지대(`careGaps`, #22)는 나무 기준이라 단체 필터를 받지 않는다. 자세한 것은 `/admin/care-gaps`.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, description: "YYYY-MM, 없으면 이번 달", schema: { type: string, example: 2026-11 } }
        - { name: organizationId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/care-gaps:
    get:
      tags: [구청]
      summary: 관리 사각지대 (돌보미 없는 나무, 이 달 활동이 끊긴 나무)
      description: |
        담당자 관리청의 나무를 나무가 서 있는 구·동별로 센다. 달은 한국 시간 달력 기준이다.
        - 돌보미 없음: 그 달에 활동 기간이 걸친 승인된 신청서가 없는 나무(대기 신청만 있는 나무, 기간이 끝난 나무 포함)
        - 활동 끊김: 돌보미는 있는데 그 달 활동 기록이 하나도 없는 나무. 이번 달이면 오늘까지의 기록으로 본다.
        - `inactiveTrees`는 활동이 끊긴 나무를 오래 끊긴 순(활동한 적 없는 나무 먼저)으로 최대 100그루 준다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, description: "YYYY-MM, 없으면 이번 달", schema: { type: string, example: 2026-07 } }
      responses:
        '200':
          description: 사각지대 집계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CareGaps' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/care-gaps/monthly:
    get:
      tags: [구청]
      summary: 연간 월별 활동 공백 (여름 공백 표시용)
      description: |
        그 해 1월부터 매달 돌보미가 있던 나무 중 활동이 끊긴 나무 수와 비율, 그 달 폭염일 수(서울 관측소)를 준다.
        올해면 이번 달까지만, 아직 오지 않은 해면 빈 목록이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: year, in: query, description: 없으면 올해, schema: { type: integer, example: 2026 } }
      responses:
        '200':
          description: 월별 활동 공백
          content:
            application/json:
              schema:
                type: object
                properties:
                  agency: { type: string }
                  year: { type: integer }
                  timeZone: { type: string, example: Asia/Seoul }
                  months:
                    type: array
                    items: { $ref: '#/components/schemas/MonthlyCareGap' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/exports/monthly:
    get:
      tags: [구청]
      summary: 월간 상부 보고 내려받기 (엑셀에서 열리는 CSV)
      description: |
        그 달 관리청 나무의 구·동별 돌봄 현황과 합계, 월간 보고서·물품 지급 요약. 달은 한국 시간 기준이다.
        - 구·동은 나무가 서 있는 위치 기준이다(관리청과 다를 수 있다).
        - 인정 봉사시간은 그 달 승인된 보고서의 기록 시간을 기록한 나무 위치로 나눈 값이다.
        - 합계의 사람 수(돌보미, 봉사 인정 인원)는 여러 동에서 활동한 사람을 한 번만 센다.
        - organizationId를 주면 그 단체 회원의 활동만 센다(관리 나무 수는 그대로).
        - CSV는 UTF-8 BOM·CRLF라 엑셀에서 바로 열린다. 사용자가 쓴 글이 =, +, -, @로 시작하면 앞에 '를 붙인다(수식 실행 방지).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, description: "YYYY-MM, 없으면 이번 달", schema: { type: string, example: 2026-11 } }
        - { name: organizationId, in: query, schema: { type: integer } }
        - { name: format, in: query, description: csv(내려받기) 또는 json(화면 미리보기), schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        '200':
          description: 월간 보고. 파일 이름 `treecare-monthly-YYYY-MM.csv`
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyExport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/exports/commendations:
    get:
      tags: [구청]
      summary: 연말 표창 대상 내려받기 (CSV)
      description: |
        그 해(한국 시간) 이 관리청에서 승인된 봉사시간이 minHours 이상인 돌보미를 많은 순으로 최대 500명. 같은 시간이면 같은 순위다.
        실명이 들어가는 개인정보라 구청 담당자만 내려받는다. 표창 기준 시간은 구청 확인 전(#59)이라 요청으로 받는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: year, in: query, description: 없으면 올해, schema: { type: integer, example: 2026 } }
        - { name: minHours, in: query, description: 이 시간 이상만(기본 0), schema: { type: number, default: 0 } }
        - { name: organizationId, in: query, schema: { type: integer } }
        - { name: format, in: query, schema: { type: string, enum: [csv, json], default: csv } }
      responses:
        '200':
          description: 표창 대상. 파일 이름 `treecare-commendations-YYYY.csv`
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: object
                properties:
                  agency: { type: string }
                  year: { type: integer }
                  minHours: { type: number }
                  organization: { type: ['object', 'null'], properties: { id: { type: integer }, name: { type: string } } }
                  people:
                    type: array
                    items:
                      type: object
                      properties:
                        rank: { type: integer }
                        userId: { type: integer }
                        nickname: { type: string }
                        realName: { type: [string, 'null'] }
                        volunteerMinutes: { type: integer, description: 그 해 승인된 봉사시간(분) }
                        approvedReports: { type: integer }
                        trees: { type: integer, description: 승인된 보고서의 기록이 있는 나무 수 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rental-items:
    get:
      tags: [구청]
      summary: 물품·재고 목록 (내 관리청)
      description: stock은 아직 배정하지 않은 재고다. 승인할 때 신청 수량만큼 줄어든다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 물품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/RentalItem' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [구청]
      summary: 물품 등록
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 50, example: 쿨토시 }
                stock: { type: integer, minimum: 0, default: 0 }
      responses:
        '201':
          description: 등록된 물품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/rental-items/{id}:
    patch:
      tags: [구청]
      summary: 물품 이름·재고 수정
      description: stock은 지금 남은(배정 가능한) 재고를 새 값으로 바꾼다. 입고하면 늘리고, 실사 후 맞춘다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name: { type: string, maxLength: 50 }
                stock: { type: integer, minimum: 0 }
      responses:
        '200':
          description: 수정된 물품
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentalItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/rentals:
    get:
      tags: [구청]
      summary: 물품 신청 목록 (내 관리청)
      description: 승인 대기(requested)는 오래 기다린 순, 나머지 상태는 최근 순이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [requested, approved, rejected, received], default: requested } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 신청 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Rental' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/rentals/{id}:
    patch:
      tags: [구청]
      summary: 물품 신청 처리 (승인·반려·수령)
      description: |
        requested → approved(재고 차감) 또는 rejected, approved → received 순서로만 바뀐다. 반납은 없다.
        재고가 신청 수량보다 적으면 승인할 수 없다(409).
        승인·반려하면 신청자에게 결과 알림(`rental_result`)을 만든다. 상태 변경·재고 차감·알림은 한 트랜잭션이다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: approved }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: rejected }
                    rejectReason: { type: string, maxLength: 500, description: 선택. 알림에 함께 보낸다 }
                - type: object
                  required: [status]
                  properties:
                    status: { type: string, const: received }
            examples:
              승인: { value: { status: approved } }
              반려: { value: { status: rejected, rejectReason: 이번 달 물량이 끝났어요 } }
              수령: { value: { status: received } }
      responses:
        '200':
          description: 처리된 신청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /admin/incident-reports:
    get:
      tags: [구청]
      summary: 이상 신고 처리 큐 (내 관리청)
      description: |
        관리청에 배정된 이상 신고(DB의 reports). 공개 게시하지 않고 구청 담당자만 본다.
        기본(unresolved)은 확인 필요·현장 확인 신고를 오래 기다린 순(경과일순)으로, resolved는 최근 완료 순으로 준다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [unresolved, pending, inspecting, resolved], default: unresolved } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: 신고 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/IncidentReport' } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/incident-reports/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      tags: [구청]
      summary: 이상 신고 상세
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 신고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReport' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [구청]
      summary: 이상 신고 처리 (현장 확인·조치 완료·처리 메모)
      description: |
        상태는 pending(확인 필요) → inspecting(현장 확인) → resolved(조치 완료) 순서로 한 단계씩만 바뀐다.
        조치 완료에는 조치 내용(actionNote)이 필요하다(앞서 남긴 메모가 있으면 그것을 쓴다). status 없이 actionNote만 고칠 수도 있다.
        조치 완료하면 신고자와 그 나무의 승인된 돌보미에게 `report_resolved` 알림을 보낸다(같은 트랜잭션, 중복 없이 한 번씩).
        조치 완료한 신고는 더 바꿀 수 없다(409).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { type: string, enum: [inspecting, resolved] }
                actionNote: { type: string, maxLength: 1000 }
            examples:
              현장 확인: { value: { status: inspecting, actionNote: 내일 현장 방문 } }
              조치 완료: { value: { status: resolved, actionNote: 지지대 보강 } }
              메모만: { value: { actionNote: 담당 부서 전달 } }
      responses:
        '200':
          description: 처리된 신고
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IncidentReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/signup:
    post:
      tags: [시민]
      summary: 회원가입
      description: 시민 계정을 만들고 토큰을 발급한다. 실명·연락처는 받지 않는다(돌보미 신청서에서 따로 받는다). 구청 담당자 계정은 운영자가 관리청과 함께 DB에서 만든다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, nickname]
              properties:
                email: { type: string, format: email, example: kth@example.com }
                password: { type: string, minLength: 8, maxLength: 72, example: password123 }
                nickname: { type: string, maxLength: 20, description: 활동 이름. 이야기·응답에 보인다, example: 태형 }
      responses:
        '201':
          description: 가입 완료
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [시민]
      summary: 로그인 (시민·구청 담당자 공통)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, example: kth@example.com }
                password: { type: string, example: password123 }
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/me:
    get:
      tags: [시민]
      summary: 내 정보
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 사용자
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trees:
    get:
      tags: [시민]
      summary: 지도 범위 안의 나무 목록 (로그인 없음)
      description: "공간 인덱스로 bbox 안의 나무를 찾는다. limit에 걸리면 truncated가 true다(지도를 더 확대하라는 뜻)."
      parameters:
        - { name: bbox, in: query, required: true, description: "서남쪽 경도,위도,동북쪽 경도,위도", schema: { type: string, example: "126.975,37.560,126.990,37.570" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
        - { name: district, in: query, description: 자치구 이름(나무가 서 있는 위치 기준). 주면 그 구의 나무만, schema: { type: string, example: 중구 } }
      responses:
        '200':
          description: 나무 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  trees: { type: array, items: { $ref: '#/components/schemas/Tree' } }
                  truncated: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }

  /trees/{id}:
    get:
      tags: [시민]
      summary: 나무 상세 (QR 이야기 페이지, 로그인 없음)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 나무
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /notifications:
    get:
      tags: [시민]
      summary: 내 알림 (최신순)
      description: 구청이 신청·보고서·물품을 처리하거나 신고를 조치 완료하면 생기는 알림. `unreadCount`는 limit과 상관없는 전체 안 읽은 개수다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: unreadOnly, in: query, schema: { type: boolean, default: false } }
      responses:
        '200':
          description: 알림 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
                  unreadCount: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /notifications/{id}/read:
    patch:
      tags: [시민]
      summary: 알림 읽음 처리
      description: 이미 읽은 알림은 처음 읽은 시각을 유지한다. 남의 알림은 404.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 읽음 처리된 알림
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /applications:
    post:
      tags: [시민]
      summary: 돌보미 신청서 제출
      description: |
        고른 나무마다 대기(pending) 신청서가 하나씩 생긴다. 구청은 그 나무 관리청의 담당자가 그루마다 따로 심사한다.
        한 그루라도 막히면 아무것도 저장하지 않는다. 시민 계정만 쓸 수 있다.
        항목은 구청 「나무돌보미(Adopt a Tree) 신청서(안)」 양식을 따른다(입양대상지는 가로수뿐이라 칸이 없다).
        - 시작일은 오늘(한국 시간)이거나 그 뒤. 종료일은 양식대로 1년 기본이라 서버가 시작일 + 1년 전날로 정한다
        - 한 번에 10그루까지 (임시값). 기업·단체(개인/가족이 아닌 유형)는 담당자가 필수
        - 반려·종료된 나무는 다시 신청할 수 있다
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [treeIds, periodStart, applicantName, headcount, postalCode, address, phone, participationType, motivation, activityPlan, agreed]
              properties:
                treeIds: { type: array, items: { type: integer }, minItems: 1, maxItems: 10, uniqueItems: true, description: 돌볼 나무 id }
                periodStart: { type: string, format: date, example: '2026-12-01', description: 활동 시작일 }
                applicantName: { type: string, maxLength: 100, description: 신청인 성명 또는 단체명 }
                contactPerson: { type: [string, 'null'], maxLength: 100, description: 기업·단체의 담당부서와 담당자 (개인/가족이 아니면 필수) }
                headcount: { type: integer, minimum: 1, maximum: 1000, description: 신청 인원 }
                postalCode: { type: string, pattern: '^\d{5}$', example: '04538' }
                address: { type: string, maxLength: 200 }
                phone: { type: string, example: 010-1234-5678, description: 연락처 }
                participationType: { type: string, enum: [individual, company, civic_group, religious_group, village_community, other], description: 개인/가족 · 기업 · 시민단체 · 종교단체 · 마을공동체 · 기타 }
                motivation: { type: string, minLength: 1, maxLength: 500, description: 신청사유 }
                activityPlan: { type: string, maxLength: 2000, description: 활동계획 (양식 별첨 2, 형식 자유) }
                organizationIntro: { type: [string, 'null'], maxLength: 2000, description: 기업·단체 소개 (양식 별첨 1, 선택) }
                agreed: { type: boolean, const: true, description: 참여 안내 사항 동의 (true여야 한다) }
      responses:
        '201':
          description: 만든 신청서 (나무마다 하나)
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications: { type: array, items: { $ref: '#/components/schemas/MyApplication' } }
        '400':
          description: 요청 값이 올바르지 않음 (지난 시작일, 빠진 양식 항목, 동의 안 함, 없는 나무 등). 칸별 사유는 error.issues

          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 시민 계정이 아님 (구청 담당자는 신청할 수 없다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 이미 대기·승인 중인 나무가 섞여 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /applications/me:
    get:
      tags: [시민]
      summary: 내 돌보미 신청서 (최신순)
      description: 내가 낸 신청서와 심사 결과. 반려됐으면 반려 사유가 함께 온다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 신청서 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  applications: { type: array, items: { $ref: '#/components/schemas/MyApplication' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /records:
    post:
      tags: [시민]
      summary: 날짜별 활동 기록·이상 신고 만들기
      description: |
        multipart/form-data 로 보낸다. 사진은 photos 칸으로 3장까지(jpg·png·webp·heic, 한 장 10MB). 시민 계정만 쓸 수 있다.
        - type=activity: 그 나무에 승인된 돌보미이고 오늘이 활동 기간 안이어야 한다(아니면 403). 활동일은 서버가 오늘(한국 시간)로 정한다.
        - type=report: 로그인한 시민이면 누구나. '확인 필요'(pending)로 그 나무 관리청의 신고 처리 큐에 들어간다. 긴급도는 유형으로 정한다(leaning·broken_branch → high, 나머지 low).
        - 검증·권한에서 막히면 올린 사진은 지운다.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [type, treeId]
              properties:
                type: { type: string, enum: [activity, report] }
                treeId: { type: integer }
                activityKinds: { type: array, items: { type: string, maxLength: 30 }, minItems: 1, maxItems: 5, description: "(activity) 한 일. 같은 이름으로 여러 번 보낸다. 쉼표 불가" }
                durationMin: { type: integer, minimum: 1, maximum: 600, description: "(activity) 활동 시간(분)" }
                category: { type: string, enum: [leaning, broken_branch, pest, withering, other], description: "(report) 신고 유형" }
                lat: { type: number, description: "(report, 선택) 신고한 위치. lng 와 함께" }
                lng: { type: number }
                memo: { type: string, maxLength: 200, description: "짧은 글 (선택)" }
                photos: { type: array, maxItems: 3, items: { type: string, format: binary } }
      responses:
        '201':
          description: 만든 기록
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Record' }
        '400':
          description: 요청 값이 올바르지 않음 (사진 4장 이상·이미지 아님 포함). 칸별 사유는 error.issues
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 시민 계정이 아니거나, 활동 기록인데 이 나무의 승인된 돌보미(활동 기간 안)가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /records/me:
    get:
      tags: [시민]
      summary: 내 기록 (한 달, 최신순)
      description: 고른 달(기본 이번 달, 한국 시간)의 활동 기록과 이상 신고. 신고는 처리 상태가 함께 온다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: 2026-11 } }
      responses:
        '200':
          description: 내 기록
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string, example: 2026-11 }
                  records: { type: array, items: { $ref: '#/components/schemas/Record' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monthly-reports/dates:
    get:
      tags: [시민]
      summary: 월간 보고서 달력용 날짜
      description: 고른 달에서 보고서에 아직 안 넣은 활동 기록이 있는 날(openDates)과, 기록을 모두 제출한 날(submittedDates).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: month, in: query, required: true, schema: { type: string, example: 2026-11 } }
      responses:
        '200':
          description: 날짜 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  month: { type: string }
                  openDates: { type: array, items: { type: string, format: date } }
                  submittedDates: { type: array, items: { type: string, format: date } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monthly-reports/draft:
    get:
      tags: [시민]
      summary: 월간 보고서 미리보기
      description: |
        고른 날짜의, 보고서에 아직 안 넣은 활동 기록을 양식 순서(fields)로 채우고 활동 시간을 더한다. 저장하지 않는다.
        agencies 가 둘 이상이면 관리청이 섞인 것이라 제출할 수 없다. 양식 항목은 구청 양식 확인 전 임시값(#59).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: dates, in: query, required: true, description: 쉼표로 구분한 같은 달 날짜, schema: { type: string, example: '2026-11-03,2026-11-05' } }
      responses:
        '200':
          description: 보고서 초안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyReportDraft' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /monthly-reports:
    post:
      tags: [시민]
      summary: 월간 보고서 제출
      description: |
        고른 날짜(같은 달)의 안 넣은 활동 기록을 묶어 '검토 대기'(submitted) 보고서를 만들고, 기록에 보고서 번호를 채운다(다시 고를 수 없음).
        보고서는 그 나무 관리청의 검토 대기 목록(/admin/monthly-reports)에 들어간다. 시민 계정만 쓸 수 있다.
        묶을 기록이 없거나(이미 냈음), 관리청이 다른 나무가 섞이거나, 달이 섞이면 400.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dates]
              properties:
                dates: { type: array, items: { type: string, format: date }, minItems: 1, maxItems: 31 }
      responses:
        '201':
          description: 제출한 보고서
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyMonthlyReport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 시민 계정이 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /monthly-reports/me:
    get:
      tags: [시민]
      summary: 내 월간 보고서 (최신순)
      description: 내가 낸 보고서와 구청 검토 결과(상태·의견·승인되어 기록된 봉사시간).
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 보고서
          content:
            application/json:
              schema:
                type: object
                properties:
                  reports: { type: array, items: { $ref: '#/components/schemas/MyMonthlyReport' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rental-items:
    get:
      tags: [시민]
      summary: 신청할 수 있는 물품과 재고
      description: 내가 지금 승인된 돌보미로 있는 나무의 관리청 물품만 남은 재고와 함께 준다. 돌보미가 아니면 빈 목록. 반납·기한은 없다.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 물품 목록
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        agency: { type: string, description: 물품을 주는 관리청 }
                        name: { type: string, example: 쿨토시 }
                        stock: { type: integer, description: 아직 배정하지 않은 재고 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /rentals:
    post:
      tags: [시민]
      summary: 물품 신청
      description: |
        '신청'(requested) 상태로 만들고 그 관리청의 물품 처리 목록에 들어간다. 재고는 구청이 승인할 때 줄인다.
        그 관리청 나무의 승인된 돌보미만(403), 한 번에 5개까지(임시값). 남은 재고보다 많거나 같은 물품에 처리 중인 신청이 있으면 409.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemId]
              properties:
                itemId: { type: integer }
                quantity: { type: integer, minimum: 1, maximum: 5, default: 1 }
      responses:
        '201':
          description: 만든 신청
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyRental' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 시민 계정이 아니거나 그 관리청 나무의 승인된 돌보미가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 재고 부족 또는 같은 물품에 처리 중인 신청이 있음
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /rentals/me:
    get:
      tags: [시민]
      summary: 내 물품 신청 현황 (최신순)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 신청
          content:
            application/json:
              schema:
                type: object
                properties:
                  rentals: { type: array, items: { $ref: '#/components/schemas/MyRental' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /trees/{id}/story:
    get:
      tags: [시민]
      summary: 나무별 공동 이야기 (QR 이야기 페이지, 로그인 없음)
      description: 그 나무의 돌보미들이 덧붙인 글 중 공개 글만 오래된 순으로 준다. 글쓴이는 본인이 고른 별명 또는 실명으로만 보인다. 이야기가 없으면 빈 목록.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 이야기
          content:
            application/json:
              schema:
                type: object
                properties:
                  treeId: { type: integer }
                  entries: { type: array, items: { $ref: '#/components/schemas/StoryEntry' } }
        '404': { $ref: '#/components/responses/NotFound' }

  /trees/{id}/rings:
    get:
      tags: [시민]
      summary: 디지털 나이테 월별 집계 (로그인 없음)
      description: >-
        그해 1월~12월 12조각. 두께 = 받은 비(rainMm)와 돌봄(careMinutes·careCount), 색 = 더위(tempMaxAvg·heatDays),
        점 = 활동한 날, 별 = 공개 이야기 글, 표식 = 신고·조치·받은 호응(Src/용어.md).
        두께·색 계산 방식은 보고서 양식 확정 뒤 정하므로 서버는 원래 값만 준다(시민 웹 lib/rings.ts가 계산).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: year, in: query, required: false, schema: { type: integer, minimum: 2000, maximum: 2100 }, description: 없으면 올해(한국 시간) }
      responses:
        '200':
          description: 나이테
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreeRings' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /trees/{id}/story/entries:
    post:
      tags: [시민]
      summary: 이야기 덧붙이기
      description: 그 나무의 승인된 돌보미(오늘이 활동 기간 안)만 쓴다(403). 나무의 이야기가 없으면 같이 만든다. 실명을 고르려면 실명이 등록되어 있어야 한다(400).
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 1000 }
                authorDisplay: { type: string, enum: [nickname, real_name], default: nickname, description: 별명 / 실명 }
                isPublic: { type: boolean, default: true, description: false 면 QR 이야기 페이지에 나오지 않는다 }
      responses:
        '201':
          description: 덧붙인 글
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StoryEntry' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 시민 계정이 아니거나 이 나무의 승인된 돌보미가 아님
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }

  /story-entries/{id}:
    get:
      tags: [시민]
      summary: 이야기 글 하나 (로그인 없음)
      description: 나이테의 이야기 표식에서 글 하나로 이동할 때 쓴다. 비공개 글은 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 글과 나무
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/StoryEntry' }
                  - type: object
                    properties:
                      tree:
                        type: object
                        properties:
                          id: { type: integer }
                          code: { type: [string, 'null'] }
                          name: { type: string, example: '은행나무, 소파로 3번', description: 나무 이름 (Tree.name과 같다) }
                          species: { type: string }
                          district: { type: string }
                          roadName: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }

  /story-entries/{id}/reactions:
    post:
      tags: [시민]
      summary: 이야기 글에 호응 남기기 (좋아요·한 줄 응답, 로그인 없음)
      description: >-
        QR로 들어온 지나가는 시민이 공개 이야기 글에 남긴다. 로그인이 없어 deviceKey로 기기를 구분하며,
        같은 기기는 글 하나에 하루(한국 날짜) 한 번만 남길 수 있다(좋아요·한 줄 응답 합쳐서, 넘으면 409 ALREADY_REACTED).
        글쓴 돌보미에게 story_reaction 알림이 가고, 나이테 표식(RingMonth.reactions)에 센다. 순위에는 넣지 않는다.
        한 줄 응답 내용은 글쓴 돌보미만 본다(알림, GET /me/reactions). 비공개 글이면 404.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: 이야기 글 id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, deviceKey]
              properties:
                kind: { type: string, enum: [like, reply], description: 좋아요 / 한 줄 응답 }
                body: { type: string, minLength: 1, maxLength: 80, description: 한 줄 응답일 때만 (좋아요에는 넣지 않는다) }
                deviceKey:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{16,64}$'
                  description: 시민 웹이 기기마다 한 번 만들어 저장해 두는 무작위 값(예 crypto.randomUUID()). 응답·알림에 내보내지 않는다
      responses:
        '201':
          description: 남김
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  kind: { type: string, enum: [like, reply] }
                  body: { type: [string, 'null'] }
                  createdAt: { type: string, format: date-time }
                  likeCount: { type: integer, description: 남긴 뒤 그 글의 좋아요 수 }
                  replyCount: { type: integer, description: 남긴 뒤 그 글의 한 줄 응답 수 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /me/reactions:
    get:
      tags: [시민]
      summary: 내가 받은 호응
      description: 내가 쓴 이야기 글들이 받은 좋아요·한 줄 응답을 최신순으로 준다. 남긴 사람(기기)은 알려 주지 않는다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      responses:
        '200':
          description: 받은 호응
          content:
            application/json:
              schema:
                type: object
                properties:
                  reactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string, enum: [like, reply] }
                        body: { type: [string, 'null'], description: 한 줄 응답 내용 (좋아요면 null) }
                        createdAt: { type: string, format: date-time }
                        entry: { type: object, properties: { id: { type: integer } } }
                        tree:
                          type: object
                          properties:
                            id: { type: integer }
                            name: { type: string, example: '은행나무, 소파로 3번' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /organizations:
    post:
      tags: [시민]
      summary: 단체 만들기 (초대 코드 발급)
      description: >-
        환경단체·학교·기업이 회원 활동을 단체 이름으로 묶어 본다. 가입한 시민이 만들고, 만든 사람이 단체 관리자(admin)가 된다.
        단체 관리자는 users.role이 아니라 단체 멤버십으로 판단하며, 관리자도 자기 나무를 돌보는 돌보미다. 구청 담당자는 403.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 50, example: 서울환경연합 중구지부 }
      responses:
        '201':
          description: 만든 단체 (inviteCode 포함)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyOrganization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /organizations/join:
    post:
      tags: [시민]
      summary: 초대 코드로 단체에 연결
      description: 대소문자·앞뒤 공백은 가리지 않는다. 없는 코드는 404, 이미 회원이면 409 ALREADY_MEMBER, 구청 담당자는 403.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode: { type: string, example: K7QM2XPA }
      responses:
        '201':
          description: 가입한 단체 (회원에게는 inviteCode가 없다)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyOrganization' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/me:
    get:
      tags: [시민]
      summary: 내가 속한 단체
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: 내 단체 목록 (가입한 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  organizations: { type: array, items: { $ref: '#/components/schemas/MyOrganization' } }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /organizations/{id}/summary:
    get:
      tags: [시민]
      summary: 단체 리포트 (단체 관리자만)
      description: >-
        그 달 회원의 날짜별 활동 기록(승인 여부 상관없음)을 합계·도로 구간(노선)별·회원별로 묶는다.
        회원은 별명·역할·합계만 보여 주고 실명·연락처·사진·메모는 주지 않는다. 단체는 기록을 읽기만 한다.
        관리자가 아니면 403.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: string, example: 2026-11 }, description: YYYY-MM }
      responses:
        '200':
          description: 단체 리포트
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{id}/sections:
    get:
      tags: [시민]
      summary: 단체 관심 구간 목록 (단체 회원)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200':
          description: 관심 구간 (추가한 순)
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections: { type: array, items: { $ref: '#/components/schemas/OrganizationSection' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [시민]
      summary: 관심 구간 추가 (단체 관리자)
      description: >-
        구간은 자치구 + 길(나무의 노선명 → 동 → 자치구 중 있는 것, 시민 웹 Tree의 roadName ?? dong ?? district)이다.
        가로수가 없는 구간은 404, 이미 있으면 409 SECTION_EXISTS, 단체당 20개를 넘으면 400 SECTION_LIMIT.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [district, place]
              properties:
                district: { type: string, example: 중구 }
                place: { type: string, example: 소파로 }
      responses:
        '201':
          description: 추가한 구간
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrganizationSection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /organizations/{id}/sections/{sectionId}:
    delete:
      tags: [시민]
      summary: 관심 구간 지우기 (단체 관리자)
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: sectionId, in: path, required: true, schema: { type: integer } }
      responses:
        '204': { description: 지움 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /organizations/{id}/section-report:
    get:
      tags: [시민]
      summary: 단체 관심 구간 리포트 (단체 회원, 익명 합계)
      description: >-
        관심 구간의 모든 돌보미(단체 회원이 아니어도) 활동을 구간·나무 단위 익명 합계로 묶는다.
        사람(이름·별명·id)·사진·메모는 담지 않는다(절대 규칙: 다른 참여자 신원은 익명 합계로만).
        나무 상태는 관리 사각지대 정의와 같다: 돌보미 없음 / 활동 끊김(돌보미는 있는데 그 달 활동 없음) / 돌봄 중.
        format=csv면 단체 이름이 든 엑셀용 CSV(UTF-8 BOM) 파일로 내려준다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: string, example: 2026-11 }, description: YYYY-MM }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: 구간 리포트
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SectionReport' }
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /volunteer-hours/me:
    get:
      tags: [시민]
      summary: 내 봉사시간
      description: 구청이 승인해 기록된 내 봉사시간만 최신순으로 준다. 본인 것만 볼 수 있다.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: year, in: query, description: 기록된 해(한국 시간). 없으면 전체, schema: { type: integer } }
      responses:
        '200':
          description: 봉사시간 목록과 합계
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalMinutes: { type: integer }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        minutes: { type: integer }
                        recordedAt: { type: string, format: date-time }
                        monthlyReport:
                          type: object
                          properties:
                            id: { type: integer }
                            agency: { type: string }
                            submittedAt: { type: string, format: date-time }
                            firstDate: { type: string, format: date }
                            lastDate: { type: string, format: date }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /weather/today:
    get:
      tags: [시민]
      summary: 오늘의 날씨와 활동 추천 시간 (로그인 없음)
      description: |
        기상청 단기예보(오늘 02시 발표, 02:15 전에는 어제 23시 발표)와 기상특보 발효 현황(서울)으로 만든다.
        - 일 최고기온 33℃ 이상이거나 폭염특보가 있으면 `isHeatwave: true`, 11~17시는 추천하지 않는다.
        - 추천 시간: 06~20시 중 비가 오지 않고 강수확률 60% 미만, 기온 -5℃ 초과 31℃ 미만인 시각을 이어 붙인 시간대
        - treeId를 주면 그 나무 위치(기상청 5km 격자), 없으면 서울시청 기준이다. 같은 격자는 30분 동안 캐시한다.
      parameters:
        - { name: treeId, in: query, schema: { type: integer } }
      responses:
        '200':
          description: 오늘 날씨 요약
          content:
            application/json:
              schema:
                type: object
                properties:
                  date: { type: string, format: date }
                  tempMax: { type: [number, 'null'], description: 일 최고기온(℃) }
                  tempMin: { type: [number, 'null'], description: 일 최저기온(℃) }
                  isHeatwave: { type: boolean }
                  warnings: { type: array, items: { type: string }, example: [폭염경보] }
                  recommendedTimes:
                    type: array
                    items:
                      type: object
                      properties:
                        start: { type: string, example: '06:00' }
                        end: { type: string, example: '09:00' }
                  message: { type: string, description: 홈 화면 안내 문구 }
                  hourly:
                    type: array
                    items:
                      type: object
                      properties:
                        hour: { type: integer }
                        temp: { type: [number, 'null'] }
                        pop: { type: [number, 'null'], description: 강수확률(%) }
                        precipitationType: { type: integer, description: '0 없음, 1 비, 2 비/눈, 3 눈, 4 소나기' }
                        sky: { type: [integer, 'null'], description: '1 맑음, 3 구름많음, 4 흐림' }
                  location:
                    type: object
                    properties:
                      treeId: { type: [integer, 'null'] }
                      nx: { type: integer }
                      ny: { type: integer }
                  forecastBase: { type: string, example: 20261112 0200, description: 사용한 단기예보 발표 시각 }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: 기상청 정보를 가져오지 못함 (키 미설정·활용 신청 전·기상청 장애)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: NOT_FOUND }
            message: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        nickname: { type: string, description: 활동 이름 }
        role: { type: string, enum: [citizen, officer] }
        agency: { type: [string, 'null'], description: 구청 담당자의 소속 관리청 }
        educationCompleted: { type: boolean, description: 돌보미 교육 이수 여부 }
    AuthResponse:
      type: object
      properties:
        token: { type: string, description: JWT. 7일 유효. Authorization Bearer 헤더에 넣는다 }
        user: { $ref: '#/components/schemas/User' }
    Tree:
      type: object
      properties:
        id: { type: integer }
        code: { type: [string, 'null'], example: 11140-00123, description: 관리번호 "자치구코드-구 안 순번". 서울시 트리맵 번호가 공개되지 않아 자체 부여. 화면·QR 명판에 쓴다 }
        name:
          type: string
          example: '은행나무, 소파로 3번'
          description: >-
            화면에 보여 줄 나무 이름 "수종, 길 N번". 길은 노선명 → 동 → 자치구 중 있는 것, N은 그 길(서울 전체) 안에서
            관리번호 순으로 센 번호라 서울 전체에서 겹치지 않는다. 적재 직후 번호를 매기기 전이면 번호 없이 "수종, 길"
        species: { type: string, example: 은행나무 }
        location:
          type: object
          properties: { lng: { type: number }, lat: { type: number } }
        district: { type: string, description: 위치한 자치구, example: 중구 }
        dong: { type: [string, 'null'] }
        roadName: { type: [string, 'null'], description: 노선, example: 명동길 }
        caregiverCount: { type: integer, description: 승인된 돌보미 수 }
        hasOpenReport: { type: boolean, description: 조치 완료 전인 이상 신고가 있는지 }
        careGap: { type: [string, 'null'], enum: [no_caregiver, inactive, null], description: "관리 사각지대(#22). no_caregiver = 이번 달 활동 기간이 걸친 승인된 돌보미 없음, inactive = 돌보미는 있는데 이번 달(한국 시간, 오늘까지) 활동 기록 없음, null = 돌보미가 이번 달 활동함. 지도에 '관리가 필요한 나무'로 강조하는 데 쓴다" }
    TreeDetail:
      allOf:
        - { $ref: '#/components/schemas/Tree' }
        - type: object
          properties:
            agency: { type: string, description: 관리청. 신고 배정·돌보미 심사 기준 }
            address: { type: [string, 'null'] }
            sameRoadCount: { type: integer, description: 같은 자치구·노선의 나무 수 }
            sameDongCount: { type: integer, description: 같은 자치구·동의 나무 수 }
            speciesCard:
              description: 수종별 기본 콘텐츠 카드(Src/content/species-cards.json). 상위 10종 밖이면 null. 화면에 source 문구를 함께 보여 준다
              oneOf:
                - { $ref: '#/components/schemas/SpeciesCard' }
                - { type: 'null' }
            neighbors:
              type: array
              maxItems: 2
              description: >-
                양옆 나무(내 나무 찾아가기). 같은 자치구·노선에서 50m 안에 있는 나무 중 가장 가까운 나무와,
                그 반대쪽(방향이 90°보다 크게 벌어진 쪽)에서 가장 가까운 나무. 도로 끝이면 1개, 없으면 빈 배열
              items: { $ref: '#/components/schemas/TreeNeighbor' }
    TreeNeighbor:
      type: object
      properties:
        id: { type: integer }
        species: { type: string, example: 느티나무 }
        direction: { type: string, enum: [북, 북동, 동, 남동, 남, 남서, 서, 북서], description: 내 나무에서 본 방향 }
        distanceM: { type: integer, example: 18, description: 내 나무까지 거리(m, 반올림) }
    SpeciesCard:
      type: object
      properties:
        id: { type: string, example: ginkgo }
        name: { type: string, example: 은행나무 }
        scientificName: { type: string, example: Ginkgo biloba }
        family: { type: string }
        leafType: { type: string, example: 낙엽 겉씨식물 }
        seoulCount: { type: integer, description: 서울 가로수 그루 수 }
        rank: { type: integer, description: 서울 가로수 수종 순위 }
        summary: { type: string }
        features: { type: array, items: { type: string } }
        seasons:
          type: object
          properties:
            spring: { type: string }
            summer: { type: string }
            autumn: { type: string }
            winter: { type: string }
        source: { type: string, example: '수종 정보: 국립수목원 국가생물종지식정보시스템 참고' }
    Notification:
      type: object
      properties:
        id: { type: integer }
        type: { type: string, enum: [application_result, monthly_report_result, rental_result, report_resolved, story_reaction] }
        title: { type: string }
        body: { type: string }
        treeId: { type: [integer, 'null'] }
        reportId: { type: [integer, 'null'] }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    Application:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, ended], description: 대기 / 승인 / 반려 / 종료 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        applicantName: { type: [string, 'null'], description: 신청인 성명/단체명. 양식(#6) 항목은 양식 반영 전 신청서면 null }
        contactPerson: { type: [string, 'null'], description: 기업·단체의 담당부서·담당자 }
        headcount: { type: [integer, 'null'] }
        postalCode: { type: [string, 'null'] }
        address: { type: [string, 'null'], description: 신청인 주소(나무 주소는 tree.address) }
        phone: { type: [string, 'null'] }
        participationType: { type: [string, 'null'], enum: [individual, company, civic_group, religious_group, village_community, other, null] }
        motivation: { type: [string, 'null'], description: 신청사유 }
        activityPlan: { type: [string, 'null'] }
        organizationIntro: { type: [string, 'null'] }
        agreedAt: { type: [string, 'null'], format: date-time, description: 안내 사항 동의 시각 }
        rejectReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [integer, 'null'], description: 심사한 담당자 id }
        applicant:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            realName: { type: [string, 'null'] }
        tree:
          type: object
          properties:
            id: { type: integer }
            code: { type: [string, 'null'], example: 11140-00123, description: 관리번호 }
            species: { type: string, example: 은행나무 }
            district: { type: string, description: 위치한 자치구 }
            dong: { type: [string, 'null'] }
            roadName: { type: [string, 'null'], description: 노선 }
            address: { type: [string, 'null'] }
            caregiverCount: { type: integer, description: 지금 승인된 돌보미 수 }
    MyApplication:
      type: object
      description: 시민이 보는 내 신청서. 구청용 Application과 달리 신청자·심사 담당자 정보는 없다.
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, approved, rejected, ended], description: 대기 / 승인 / 반려 / 종료 }
        periodStart: { type: string, format: date }
        periodEnd: { type: string, format: date }
        applicantName: { type: [string, 'null'], description: 신청인 성명/단체명. 양식 항목은 양식 반영 전 신청서면 null }
        contactPerson: { type: [string, 'null'] }
        headcount: { type: [integer, 'null'] }
        postalCode: { type: [string, 'null'] }
        address: { type: [string, 'null'], description: 신청인 주소 }
        phone: { type: [string, 'null'] }
        participationType: { type: [string, 'null'], enum: [individual, company, civic_group, religious_group, village_community, other, null] }
        motivation: { type: [string, 'null'], description: 신청사유 }
        activityPlan: { type: [string, 'null'] }
        organizationIntro: { type: [string, 'null'] }
        agreedAt: { type: [string, 'null'], format: date-time, description: 안내 사항 동의 시각 }
        rejectReason: { type: [string, 'null'], description: 반려 사유 }
        createdAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        tree:
          type: object
          properties:
            id: { type: integer }
            code: { type: [string, 'null'], example: 11140-00123, description: 관리번호 }
            name: { type: string, example: '은행나무, 소파로 3번', description: 나무 이름 (Tree.name과 같다) }
            species: { type: string, example: 은행나무 }
            district: { type: string, description: 위치한 자치구 }
            dong: { type: [string, 'null'] }
            roadName: { type: [string, 'null'], description: 노선 }
            address: { type: [string, 'null'] }
    Record:
      type: object
      description: 날짜별 활동 기록 또는 이상 신고
      properties:
        id: { type: integer }
        type: { type: string, enum: [activity, report] }
        recordedAt: { type: string, format: date-time }
        activityDate: { type: [string, 'null'], format: date, description: 활동일 (활동 기록만) }
        activityKinds: { type: array, items: { type: string }, description: 한 일 (신고는 빈 배열) }
        durationMin: { type: [integer, 'null'] }
        memo: { type: [string, 'null'] }
        photos: { type: array, items: { type: string, example: /uploads/2b1c-example.jpg }, description: 올린 순서대로 }
        location:
          type: [object, 'null']
          properties: { lat: { type: number }, lng: { type: number } }
        monthlyReportId: { type: [integer, 'null'], description: 월간 보고서에 넣었으면 그 보고서 id }
        report:
          type: [object, 'null']
          description: 이상 신고만
          properties:
            category: { type: string, enum: [leaning, broken_branch, pest, withering, other] }
            urgency: { type: string, enum: [low, high] }
            status: { type: string, enum: [pending, inspecting, resolved], description: 확인 필요 / 현장 확인 / 조치 완료 }
        tree:
          type: object
          properties:
            id: { type: integer }
            code: { type: [string, 'null'] }
            name: { type: string, example: '은행나무, 소파로 3번', description: 나무 이름 (Tree.name과 같다) }
            species: { type: string }
            district: { type: string }
            dong: { type: [string, 'null'] }
            roadName: { type: [string, 'null'] }
    MonthlyReportDraft:
      type: object
      properties:
        fields:
          type: array
          description: 양식 칸 순서와 이름 (Src/backend/citizen/monthly-report-form.ts)
          items:
            type: object
            properties:
              key: { type: string, enum: [date, treeName, activities, minutes, photoCount, note] }
              label: { type: string, example: 날짜 }
        rows:
          type: array
          description: 날짜순, 같은 날이면 나무 이름순
          items:
            type: object
            properties:
              recordId: { type: integer }
              values: { type: object, description: 'fields 의 key → 칸 값. 예 { date: 2026-11-03, treeName: 은행나무, 명동길, activities: 쓰레기 줍기, 보호틀 정리, minutes: 30, photoCount: 2, note: 낙엽 }' }
        dates: { type: array, items: { type: string, format: date } }
        totalMinutes: { type: integer }
        treeCount: { type: integer }
        agencies: { type: array, items: { type: string }, description: 관리청. 둘 이상이면 제출할 수 없다 }
    MyMonthlyReport:
      type: object
      description: 시민이 보는 내 월간 보고서
      properties:
        id: { type: integer }
        status: { type: string, enum: [submitted, approved, revision_requested], description: 검토 대기 / 승인 / 보완 요청 }
        agency: { type: string, description: 낸 관리청 }
        totalMinutes: { type: integer, description: 묶인 기록의 활동 시간 합계 }
        dates: { type: array, items: { type: string, format: date } }
        recordCount: { type: integer }
        reviewNote: { type: [string, 'null'], description: 구청 의견 (보완 요청 사유 등) }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        volunteerMinutes: { type: [integer, 'null'], description: 승인되어 기록된 봉사시간(분). 승인 전 null }
    MyRental:
      type: object
      description: 시민이 보는 내 물품 신청
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, approved, rejected, received], description: 신청 / 승인 / 반려 / 수령 }
        quantity: { type: integer }
        item:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            agency: { type: string }
        rejectReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        handledAt: { type: [string, 'null'], format: date-time, description: 구청이 승인·반려한 시각 }
        receivedAt: { type: [string, 'null'], format: date-time }
    MyOrganization:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        role: { type: string, enum: [admin, member], description: 단체 관리자 / 회원 }
        memberCount: { type: integer }
        inviteCode: { type: string, description: 관리자에게만 있다 (회원을 초대할 때 쓴다) }
        joinedAt: { type: string, format: date-time }
    OrganizationSummary:
      type: object
      properties:
        organization: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        month: { type: string, example: 2026-11 }
        memberCount: { type: integer }
        totals:
          type: object
          properties:
            minutes: { type: integer, description: 활동 시간 합계(분) }
            count: { type: integer, description: 활동 기록 수 }
            treeCount: { type: integer, description: 돌본 나무 수 }
            activityDays: { type: integer, description: 활동한 날 수 }
        sections:
          type: array
          description: 도로 구간(노선 → 동 → 자치구 중 있는 것)별, 활동 시간이 많은 순
          items:
            type: object
            properties:
              district: { type: string }
              place: { type: string, example: 소파로 }
              minutes: { type: integer }
              count: { type: integer }
              treeCount: { type: integer }
              memberCount: { type: integer, description: 그 구간에서 활동한 회원 수 }
        members:
          type: array
          description: 회원별(활동이 없어도 0으로), 활동 시간이 많은 순. 별명 외 신원 정보는 없다
          items:
            type: object
            properties:
              nickname: { type: string }
              role: { type: string, enum: [admin, member] }
              minutes: { type: integer }
              count: { type: integer }
              treeCount: { type: integer }
    OrganizationSection:
      type: object
      properties:
        id: { type: integer }
        district: { type: string, example: 중구 }
        place: { type: string, example: 소파로 }
        treeCount: { type: integer, description: 그 구간의 가로수 수 }
        createdAt: { type: string, format: date-time }
    SectionReport:
      type: object
      properties:
        organization: { type: object, properties: { id: { type: integer }, name: { type: string } } }
        month: { type: string, example: 2026-11 }
        totals:
          type: object
          properties:
            sectionCount: { type: integer }
            treeCount: { type: integer }
            activityCount: { type: integer }
            minutes: { type: integer }
            activityDays: { type: integer }
        sections:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              district: { type: string }
              place: { type: string }
              treeCount: { type: integer }
              caredTreeCount: { type: integer, description: 그 달 승인된 돌보미가 있는 나무 }
              inactiveTreeCount: { type: integer, description: 돌보미는 있는데 그 달 활동이 없는 나무 }
              noCaregiverTreeCount: { type: integer, description: 돌보미가 없는 나무 }
              caregiverCount: { type: integer, description: 그 달 돌보미 수 (한 사람이 여러 그루를 돌봐도 한 명) }
              activityCount: { type: integer }
              minutes: { type: integer }
              activityDays: { type: integer }
              reported: { type: integer, description: 그 달 접수된 신고 수 }
              resolved: { type: integer, description: 그 달 조치 완료된 신고 수 }
              trees:
                type: array
                description: 길 안 번호 순(서쪽부터)
                items:
                  type: object
                  properties:
                    treeId: { type: integer }
                    name: { type: string, example: '은행나무, 소파로 3번' }
                    status: { type: string, enum: [cared, inactive, no_caregiver], description: 돌봄 중 / 활동 끊김 / 돌보미 없음 }
                    caregiverCount: { type: integer }
                    activityCount: { type: integer }
                    minutes: { type: integer }
                    activityDays: { type: integer }
                    lastActivityDate: { type: [string, 'null'], description: 그 달 마지막 활동일 }
                    reported: { type: integer }
                    resolved: { type: integer }
    TreeRings:
      type: object
      properties:
        treeId: { type: integer }
        year: { type: integer, example: 2026 }
        months: { type: array, minItems: 12, maxItems: 12, items: { $ref: '#/components/schemas/RingMonth' }, description: 1월~12월 }
    RingMonth:
      type: object
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        rainMm: { type: [number, 'null'], description: 그 달 강수량 합계(mm, 서울 ASOS). 기상 자료가 없는 달은 null }
        tempMaxAvg: { type: [number, 'null'], description: 그 달 평균 최고기온(℃, 소수 첫째 자리). 자료가 없으면 null }
        heatDays: { type: integer, description: 폭염(일 최고기온 33℃ 이상)인 날 수 }
        careMinutes: { type: integer, description: 구청이 승인한 보고서에 든 활동 시간 합계(분). 그 나무의 모든 돌보미 것 }
        careCount: { type: integer, description: 위 활동 기록 수 }
        activityDays: { type: array, items: { type: integer }, description: 활동 기록이 있는 날(승인 여부 상관없음). 오름차순 }
        stories:
          type: array
          description: 공개 이야기 글(별). 날짜는 한국 시간. 누르면 /story-entries/{id}
          items:
            type: object
            properties:
              id: { type: integer }
              day: { type: integer }
        reported: { type: integer, description: 그 달 접수된 신고 수 }
        resolved: { type: integer, description: 그 달 조치 완료된 신고 수 }
        reactions: { type: integer, description: 그 달 받은 호응(좋아요·한 줄 응답) 수. 남긴 날(한국 날짜) 기준 }
    StoryEntry:
      type: object
      description: 공동 이야기에 덧붙인 글 하나
      properties:
        id: { type: integer }
        body: { type: string }
        isPublic: { type: boolean }
        author:
          type: object
          description: 글쓴 돌보미가 고른 이름만. 다른 신원 정보는 주지 않는다
          properties:
            displayName: { type: string, example: 은행지기 }
        likeCount: { type: integer, description: 받은 좋아요 수 }
        replyCount: { type: integer, description: 받은 한 줄 응답 수 }
        createdAt: { type: string, format: date-time }
    MonthlyReport:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [submitted, approved, revision_requested], description: 검토 대기 / 승인 / 보완 요청 }
        agency: { type: string, description: 제출한 관리청 }
        totalMinutes: { type: integer, description: 묶인 기록의 활동 시간 합계(분) }
        reviewNote: { type: [string, 'null'], description: 구청 의견 }
        submittedAt: { type: string, format: date-time }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewedBy: { type: [integer, 'null'] }
        caregiver:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            realName: { type: [string, 'null'] }
        recordCount: { type: integer }
        treeCount: { type: integer }
        firstDate: { type: [string, 'null'], format: date }
        lastDate: { type: [string, 'null'], format: date }
        volunteerMinutes: { type: [integer, 'null'], description: 승인되어 기록된 봉사시간(분) }
    MonthlyReportDetail:
      allOf:
        - { $ref: '#/components/schemas/MonthlyReport' }
        - type: object
          properties:
            records:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  activityDate: { type: string, format: date }
                  activityKind: { type: [string, 'null'] }
                  durationMin: { type: integer }
                  memo: { type: [string, 'null'] }
                  photoUrl: { type: [string, 'null'] }
                  verification: { type: string, enum: [none, location, photo] }
                  tree:
                    type: object
                    properties:
                      id: { type: integer }
                      species: { type: string }
                      roadName: { type: [string, 'null'] }
                      address: { type: [string, 'null'] }
    Dashboard:
      type: object
      properties:
        agency: { type: string }
        month: { type: string, example: 2026-11 }
        organizationId: { type: [integer, 'null'] }
        monthlyReports:
          type: object
          properties:
            pending: { type: integer, description: 검토 대기 보고서 }
            revisionRequested: { type: integer, description: 보완 요청 후 재제출 대기 }
        applications:
          type: object
          properties:
            pending: { type: integer, description: 심사 대기 신청 }
        rentals:
          type: object
          properties:
            requested: { type: integer, description: 승인 대기 물품 }
            awaitingPickup: { type: integer, description: 승인 후 수령 대기 }
        incidentReports:
          type: object
          description: 이상 신고(reports)
          properties:
            pending: { type: integer, description: 확인 필요 }
            inspecting: { type: integer, description: 현장 확인 }
            oldestUnresolvedAt: { type: [string, 'null'], format: date-time, description: 가장 오래된 미처리 신고 접수 시각 }
        caregivers:
          type: object
          properties:
            active: { type: integer, description: 이달 활동 중인 돌보미 }
            missingReport: { type: integer, description: 이달 보고서 미제출 돌보미 }
            missingReportList:
              type: array
              description: 미제출 돌보미 (최대 50명)
              items:
                type: object
                properties:
                  userId: { type: integer }
                  nickname: { type: string }
                  realName: { type: [string, 'null'] }
                  treeCount: { type: integer }
        volunteerHours:
          type: object
          properties:
            minutes: { type: integer, description: 이달 기록된 봉사시간(분) }
            people: { type: integer, description: 이달 봉사시간을 인정받은 사람 수 }
        careGaps:
          type: object
          description: 관리 사각지대(#22). 단체 필터와 상관없이 관리청 전체
          properties:
            noCaregiver: { type: integer, description: 돌보미가 없는 나무 }
            inactive: { type: integer, description: 돌보미는 있는데 이달 활동이 끊긴 나무 }
        organizations:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    CareGapCounts:
      type: object
      properties:
        trees: { type: integer, description: 관리 나무 수 }
        noCaregiver: { type: integer, description: 돌보미가 없는 나무 }
        inactive: { type: integer, description: 돌보미는 있는데 이 달 활동이 끊긴 나무 }
    CareGaps:
      type: object
      properties:
        agency: { type: string }
        month: { type: string, example: 2026-07 }
        totals: { $ref: '#/components/schemas/CareGapCounts' }
        byDong:
          type: array
          description: 나무가 서 있는 구·동별. 구, 동 이름순(동 없음은 끝)
          items:
            allOf:
              - type: object
                properties:
                  district: { type: string }
                  dong: { type: [string, 'null'] }
              - { $ref: '#/components/schemas/CareGapCounts' }
        inactiveTrees:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              code: { type: [string, 'null'], description: 관리번호 }
              species: { type: string }
              district: { type: string }
              dong: { type: [string, 'null'] }
              roadName: { type: [string, 'null'] }
              caregiverCount: { type: integer, description: 이 달 활동 기간이 걸친 돌보미 수 }
              lastActivityDate: { type: [string, 'null'], format: date, description: 이 달 전 마지막 활동일. 활동한 적 없으면 null }
    ExportRegionCounts:
      type: object
      properties:
        trees: { type: integer, description: 관리 나무 }
        caredTrees: { type: integer, description: 그 달 돌보미가 있던 나무 }
        caregivers: { type: integer, description: 그 달 활동 기간이 걸친 돌보미 수 }
        activityRecords: { type: integer, description: 그 달 활동 기록 수 }
        activityMinutes: { type: integer }
        volunteerMinutes: { type: integer, description: 그 달 승인된 봉사시간(기록한 나무 위치 기준) }
        volunteerPeople: { type: integer }
        incidentsReceived: { type: integer, description: 그 달 접수된 이상 신고 }
        incidentsResolved: { type: integer, description: 그 달 조치 완료한 이상 신고 }
    MonthlyExport:
      type: object
      properties:
        agency: { type: string }
        month: { type: string, example: 2026-11 }
        organization: { type: ['object', 'null'], properties: { id: { type: integer }, name: { type: string } } }
        regions:
          type: array
          items:
            allOf:
              - type: object
                properties:
                  district: { type: string }
                  dong: { type: [string, 'null'] }
              - { $ref: '#/components/schemas/ExportRegionCounts' }
        totals: { $ref: '#/components/schemas/ExportRegionCounts' }
        monthlyReports:
          type: object
          properties:
            submitted: { type: integer }
            approved: { type: integer }
            revisionRequested: { type: integer }
        rentals:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              approvedQuantity: { type: integer, description: 그 달 승인한 수량(이미 수령한 것 포함) }
              receivedQuantity: { type: integer, description: 그 달 수령한 수량 }
    MonthlyCareGap:
      type: object
      properties:
        month: { type: string, example: 2026-07 }
        caredTrees: { type: integer, description: 돌보미가 있던 나무 }
        activeTrees: { type: integer, description: 그중 활동 기록이 있는 나무 }
        inactiveTrees: { type: integer, description: 그중 활동이 끊긴 나무 }
        inactiveRate: { type: [number, 'null'], description: inactiveTrees / caredTrees (소수 셋째 자리). 돌보미 있는 나무가 없으면 null }
        heatwaveDays: { type: integer, description: 그 달 폭염일 수(서울 관측소) }
    RentalItem:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        stock: { type: integer, description: 아직 배정하지 않은 재고 }
        requestedQuantity: { type: integer, description: 승인 대기 중인 신청 수량 합계 }
        awaitingPickupQuantity: { type: integer, description: 승인했지만 아직 수령하지 않은 수량 합계 }
        createdAt: { type: string, format: date-time }
    Rental:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [requested, approved, rejected, received], description: 신청 / 승인 / 반려 / 수령 }
        quantity: { type: integer }
        rejectReason: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        handledAt: { type: [string, 'null'], format: date-time }
        handledBy: { type: [integer, 'null'] }
        receivedAt: { type: [string, 'null'], format: date-time }
        item:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            stock: { type: integer }
        requester:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
            realName: { type: [string, 'null'] }
    IncidentReport:
      type: object
      properties:
        id: { type: integer }
        status: { type: string, enum: [pending, inspecting, resolved], description: 확인 필요 / 현장 확인 / 조치 완료 }
        category: { type: string, enum: [leaning, broken_branch, pest, withering, other] }
        categoryLabel: { type: string, example: 기울어짐·쓰러짐 }
        urgency: { type: string, enum: [low, high] }
        isTrusted: { type: boolean, description: 신고 시점에 교육을 이수한 신고자인지 }
        actionNote: { type: [string, 'null'], description: 처리 메모·조치 내용 }
        createdAt: { type: string, format: date-time }
        inspectedAt: { type: [string, 'null'], format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        handledBy: { type: [integer, 'null'] }
        elapsedDays: { type: integer, description: 접수 후 지난 날 수(한국 날짜). 조치 완료면 완료까지 걸린 날 수 }
        photoUrl: { type: [string, 'null'] }
        location:
          type: [object, 'null']
          description: 신고한 위치
          properties:
            lat: { type: number }
            lng: { type: number }
        reporter:
          type: object
          properties:
            id: { type: integer }
            nickname: { type: string }
        tree:
          type: object
          properties:
            id: { type: integer }
            species: { type: string }
            roadName: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            location:
              type: object
              properties:
                lat: { type: number }
                lng: { type: number }
  responses:
    BadRequest:
      description: 요청 값이 올바르지 않음
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: "지금 상태에서는 할 수 없음 (예: 이미 심사한 신청서)"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 로그인 필요 (토큰 없음·만료)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 권한 없음 (구청 담당자가 아님)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 대상 없음 (다른 관리청의 데이터도 404로 돌려준다)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
